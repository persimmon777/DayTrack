name: DayTrack

options:
  bundleIdPrefix: app.daytrack
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true
  developmentLanguage: ru

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

packages:
  DayTrackCore:
    path: Packages/DayTrackCore

targets:
  DayTrack:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: DayTrackWidgets
      - package: DayTrackCore
        product: DayTrackCore
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: DayTrack
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [ru]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.daytrack.DayTrack
        CODE_SIGN_ENTITLEMENTS: Config/DayTrack.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  DayTrackWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    dependencies:
      - package: DayTrackCore
        product: DayTrackCore
    info:
      path: Config/Widgets-Info.plist
      properties:
        CFBundleDisplayName: DayTrack
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [ru]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.daytrack.DayTrack.Widgets
        CODE_SIGN_ENTITLEMENTS: Config/DayTrackWidgets.entitlements

schemes:
  DayTrack:
    build:
      targets:
        DayTrack: all
    run:
      config: Debug
    archive:
      config: Release
